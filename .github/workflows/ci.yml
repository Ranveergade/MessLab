name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: messlab.settings
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Django checks
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Test suite
        run: python manage.py test -v 2

      - name: Static files collect cleanly
        env:
          DJANGO_SETTINGS_MODULE: messlab.settings_prod
          SECRET_KEY: ci-only-secret-value-not-for-production
          ALLOWED_HOSTS: ci.example.test
          MESSLAB_ALLOW_SQLITE: "1"
          MESSLAB_ALLOW_CONSOLE_EMAIL: "1"
          MESSLAB_SECURE_COOKIES: "0"
          MESSLAB_SSL_REDIRECT: "0"
        run: python manage.py collectstatic --noinput
